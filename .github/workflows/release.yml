name: Publish signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: pcbkeeper-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      LC_ALL: C.UTF-8

      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      EXPECTED_CERT_SHA256: 'E5:28:86:F0:1E:61:CC:31:7D:93:DF:C6:D3:A3:44:9F:9F:48:E2:BF:95:4B:3A:CD:63:74:39:72:1F:8B:10:EB'

    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected format: v1.2.0"
            exit 1
          fi

          version="${tag#v}"
          notes_file="release-notes/${tag}.md"

          version_name="$(
            sed -nE \
              "s/^[[:space:]]*versionName[[:space:]]*(=)?[[:space:]]*['\"]([^'\"]+)['\"].*/\2/p" \
              app/build.gradle |
            head -n 1
          )"

          if [[ -z "$version_name" ]]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi

          if [[ "$version_name" != "$version" ]]; then
            echo "Version mismatch:"
            echo "  tag:         $tag"
            echo "  versionName: $version_name"
            exit 1
          fi

          if [[ ! -s "$notes_file" ]]; then
            echo "Release notes file is missing or empty:"
            echo "  $notes_file"
            exit 1
          fi

          git fetch \
            --no-tags \
            origin \
            main:refs/remotes/origin/main

          if ! git merge-base \
            --is-ancestor \
            "$GITHUB_SHA" \
            refs/remotes/origin/main
          then
            echo "The tagged commit does not belong to the main branch."
            exit 1
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f gradlew || {
            echo "Gradle Wrapper script is missing: gradlew"
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.jar || {
            echo "Gradle Wrapper JAR is missing:"
            echo "  gradle/wrapper/gradle-wrapper.jar"
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "Gradle Wrapper properties are missing:"
            echo "  gradle/wrapper/gradle-wrapper.properties"
            exit 1
          }

          chmod +x gradlew
          ./gradlew --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path '*/bin/sdkmanager' \
              -print \
              -quit
          )"

          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager was not found under:"
            echo "  $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          yes | "$sdkmanager" --licenses >/dev/null || true

          "$sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail

          test -n "${ANDROID_KEYSTORE_BASE64:-}" || {
            echo "ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          }

          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || {
            echo "ANDROID_KEYSTORE_PASSWORD is not configured."
            exit 1
          }

          test -n "${ANDROID_KEY_ALIAS:-}" || {
            echo "ANDROID_KEY_ALIAS is not configured."
            exit 1
          }

          test -n "${ANDROID_KEY_PASSWORD:-}" || {
            echo "ANDROID_KEY_PASSWORD is not configured."
            exit 1
          }

          keystore_path="$RUNNER_TEMP/pcbkeeper-release.p12"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$keystore_path"

          chmod 600 "$keystore_path"

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Verify signing key
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_cert_sha256="$(
            keytool -list -v \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            head -n 1 |
            tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$actual_cert_sha256" ]]; then
            echo "Could not read signing certificate fingerprint."
            exit 1
          fi

          if [[ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Unexpected signing certificate."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $actual_cert_sha256"
            exit 1
          fi

          echo "Signing certificate verified."

      - name: Run release unit tests
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            testReleaseUnitTest

      - name: Run release lint
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            lintRelease

      - name: Build signed release APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Prepare release files
        shell: bash
        run: |
          set -Eeuo pipefail

          source_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="dist"
          apk_name="PrivateCardBackupKeeper-${RELEASE_VERSION}.apk"

          if [[ ! -f "$source_apk" ]]; then
            echo "Signed release APK was not created:"
            echo "  $source_apk"
            exit 1
          fi

          mkdir -p "$output_dir"

          cp "$source_apk" "$output_dir/$apk_name"
          cp "$RELEASE_NOTES_FILE" "$output_dir/RELEASE_NOTES.md"

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          cert_output="$(
            "$apksigner" verify \
              --verbose \
              --print-certs \
              "$output_dir/$apk_name"
          )"

          printf '%s\n' "$cert_output"

          actual_apk_cert="$(
            printf '%s\n' "$cert_output" |
              sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]'
          )"

          expected_apk_cert="${EXPECTED_CERT_SHA256//:/}"

          if [[ -z "$actual_apk_cert" ]]; then
            echo "Could not read the APK signing certificate."
            exit 1
          fi

          if [[ "$actual_apk_cert" != "$expected_apk_cert" ]]; then
            echo "APK was signed with an unexpected certificate."
            echo "Expected: $expected_apk_cert"
            echo "Actual:   $actual_apk_cert"
            exit 1
          fi

          (
            cd "$output_dir"
            sha256sum "$apk_name" > SHA256SUMS.txt
          )

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: pcbkeeper-release-files
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/PrivateCardBackupKeeper-${{ env.RELEASE_VERSION }}.apk
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pcbkeeper-build-reports-${{ github.ref_name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.html

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: pcbkeeper-release-files
          path: release-files

      - name: Validate downloaded files
        shell: bash
        run: |
          set -Eeuo pipefail

          version="${GITHUB_REF_NAME#v}"

          test -f \
            "release-files/PrivateCardBackupKeeper-${version}.apk"

          test -f \
            "release-files/SHA256SUMS.txt"

          test -s \
            "release-files/RELEASE_NOTES.md"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          apk="release-files/PrivateCardBackupKeeper-${version}.apk"
          checksums="release-files/SHA256SUMS.txt"
          notes="release-files/RELEASE_NOTES.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $tag"
            exit 1
          fi

          gh release create "$tag" \
            "$apk#PrivateCard Backup Keeper ${version}" \
            "$checksums#SHA-256 checksum" \
            --verify-tag \
            --title "PrivateCard Backup Keeper ${version}" \
            --notes-file "$notes"
