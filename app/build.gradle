plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def releaseSigningConfigured = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.max.privatecardbackup'
    compileSdk 35
    buildToolsVersion '35.0.0'
 
    defaultConfig {
        applicationId 'com.max.privatecardbackup'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '1.1.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storeType 'PKCS12'
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            
           if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
